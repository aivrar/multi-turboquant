name: Linux compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    name: Debian ${{ matrix.release }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.release }}-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "12"
            python: "3.11"
          - release: "13"
            python: "3.13"
    steps:
      - name: Install distribution prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-pip python3-venv ca-certificates

      - uses: actions/checkout@v4

      - name: Create isolated test environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          .ci-venv/bin/python -m pip install -e ".[dev]"

      - name: Verify distribution and interpreter
        run: |
          cat /etc/os-release
          .ci-venv/bin/python -c "import platform, sys; print(platform.platform()); print(sys.version); print(sys.executable)"

      - name: Run test suite
        run: .ci-venv/bin/python -m pytest -q
